section_id: home
headline: Learn to maintain your brain through play!
body: |-
  Lifestyle changes could <strong><u>delay or prevent 45% of cognitive impairment</u></strong>, but the general public is typically not aware of this potential. <br><br>
  We co-created the <strong>Maintaining Brains Game</strong> to share research on strategies to maintain and improve brain health!
