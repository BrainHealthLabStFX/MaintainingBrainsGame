creators:
  title: How The Game Was Created
  p1: We co-created our initial draft, the Maintain Your Brain Game, at a workshop
    funded by the Canadian Institutes of Health Research (CIHR). The workshop
    brought together people with lived experience of cognitive impairment,
    Indigenous educators, South Asian educators, healthcare providers, and
    academic researchers.
  p2: Since then, we co-created Maintaining Brains with high school teachers and
    the national youth-serving organization, Actua. This youth-focused version
    incorporates trauma-informed principles of agency, strengths-based
    approaches, and safe environments.
  image: assets/images/uploads/workshop-1.jpeg
  focal_point: object-top
  badges:
    - title: CIHR
      subtitle: Workshop Grant
    - title: Actua
      subtitle: STEM Outreach
    - title: Trauma
      subtitle: Informed Design
  image_title: Co-Creators at Toronto Workshop
  image_caption: Collaborative development with educators, clinicians, and
    individuals with lived experience.
teachers:
  feedback_button_text: Contact Us with Feedback
  body: The Maintaining Brains Game provides educators with an engaging way to
    introduce students to concepts related to brain health, cognition, and
    lifelong wellness.
  image_caption: X-Chem STEM Outreach Session at Dr. John Hugh Gillis High School
  curriculum_body: We reviewed English program Nova Scotia curriculum outcomes and
    guidelines to identify specific outcomes that the Maintaining Brains Game
    helps achieve in high school science, health, and psychology classes.
  questions:
    - question: Why is it important to think about brain health throughout life?
    - question: How do everyday lifestyle choices influence cognitive wellness and
        reserve?
    - question: What is one thing you learned that you can apply in your own daily life?
    - question: How can communities support healthy aging and brain resilience?
  discussion_questions_title: Student Discussion Questions (Created by IB Psychology Students)
  curriculum_title: Curriculum Outcomes Alignment
  title: For Educators & Teachers
  image: assets/images/real/X-Chem-1-2xl.jpeg
  feedback_body: If you use Maintaining Brains in your classroom outside Nova
    Scotia, we'd love to hear how it went!
  feedback_title: Are you a teacher using the game?
download:
  title: Download Game Materials
  body: Everything you need to facilitate and play the Maintaining Brains Game in
    your classroom or community group. Download complete PDF card packages and
    instruction sheets.
  button_label: Download Game Package
  button_url: "#"
  printing_tips:
    - tip: Print on white, blue, or yellow paper matching the filename color code.
    - tip: Files include full crop marks and bleeds for professional laser cutters.
    - tip: "Recommended paper weight: 65 - 90 lb cardstock."
    - tip: Laminating increases durability, though cards become thicker to handle.
  materials_needed:
    - icon: science
      name: Plastic Straws
    - icon: hub
      name: Pipe Cleaners
    - icon: circle
      name: Glass Marbles
    - icon: masks
      name: Face Masks
