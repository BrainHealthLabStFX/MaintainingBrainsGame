section_id: tools
title: Easy to Customize
body: |
  Want to make your own version of the Maintaining Brains Game or populate card templates directly from a spreadsheet? Use our open-source generator tool!

  If you've already created a custom version for your students or community group, <a href="mailto:emazerol@stfx.ca" class="text-brand-pink hover:text-brand-darkPink hover:underline font-bold transition-colors">we'd love to hear how it went!</a>
button_label: Open Card Generator Tool
button_url: https://www.maintainingbrains.ca/tools.html
