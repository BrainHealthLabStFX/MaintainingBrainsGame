section_id: download
title: Play The Game
body: Everything you need to facilitate and play the Maintaining Brains game in your classroom or community group. Download PDFs of cards and instruction sheets, and check out our facilitator slideshow.
button_label: Download
button_url: https://drive.google.com/drive/folders/1-8XYyH6yKuVknsQmA1bTiwscgonL_Rxg?usp=drive_link
printing_tips:
  - tip: Print on white, blue, or yellow paper depending on the colour in the filename.
  - tip: Files include crop marks and bleeds for professional print shops with laser cutters.
  - tip: 'Recommended paper weight: 65 - 90 lb cardstock.'
  - tip: Laminating increases durability, but thicker cards can be harder to handle.
materials_intro: Other than the cards and instruction sheets, the Maintaining Brains game uses a few low-cost and easy-to-find items. They can be reused again and again!
materials_needed:
  - icon: ''
    name: Straws
  - icon: ''
    name: Pipe cleaners
  - icon: ''
    name: Marbles
  - icon: ''
    name: Face masks
