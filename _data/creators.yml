title: "How The Game Was Created"
p1: "In summer 2024, our team hosted youth workshops funded by a CIHR Planning and Dissemination grant, in collaboration with X-Chem Outreach at StFX and Actua. Youth explored brain health research and co-created game ideas, artwork, and mechanics for sharing evidence-based brain health strategies."
p2: "In fall 2024, IB Psychology students co-created discussion questions. The result is a print-and-play card game designed to spark conversations about how daily choices protect brain health."
