section_id: about
title: How The Game Was Created
p1: We hosted a workshop which brought together people with lived experience of cognitive impairment, care partners, Indigenous educators, South Asian educators, healthcare providers, and academic researchers. We co-created our initial draft, the Maintain Your Brain Game, at this workshop.
p2: Since then, we co-created Maintaining Brains with a high school teacher and a national youth-serving organization, Actua. This youth-focused version incorporates trauma-informed principles of agency, strengths-based approaches, and safe environments.
