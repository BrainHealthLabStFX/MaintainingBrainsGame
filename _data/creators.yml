section_id: about
title: About the Game
p1: |-
  Cases of cognitive impairment (problems with thinking or memory) are increasing. Almost half of cognitive impairment cases can be prevented or delayed by making lifestyle changes. We wanted to get the word out!
  <br><br>
  We hosted a workshop which brought together over 25 people with lived experience of cognitive impairment, care partners, Indigenous educators, South Asian educators, healthcare providers, and academic researchers. We co-created our initial draft, the Maintain Your Brain game, at this workshop.
p2: Since then, we co-created Maintaining Brains with a high school teacher and a national youth-serving organization, Actua. This youth-focused version incorporates trauma-informed principles of agency, strengths-based approaches, and safe environments.
