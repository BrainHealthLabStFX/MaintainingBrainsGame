backend:
  name: github
  repo: BrainHealthLabStFX/MaintainingBrainsGame
  branch: main

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

collections:
  - name: "site_configuration"
    label: "Site Configuration"
    files:
      - file: "_data/configuration.yml"
        label: "Global Settings"
        name: "configuration_data"
        fields:
          - { label: "Enable Password Protection", name: "password_protected", widget: "boolean", default: false, required: false }
          - { label: "Site Password", name: "site_password", widget: "string", required: false, comment: "Password required to view the site if protection is enabled" }
          - { label: "Favicon Image", name: "favicon", widget: "image", required: false, comment: "Upload an image (PNG/JPG/ICO) to use as the browser tab icon" }

  - name: "navigation"
    label: "Header Navigation"
    files:
      - file: "_data/menu.yml"
        label: "Menu Links"
        name: "menu_data"
        fields:
          - label: "Menu Links"
            name: "menu_links"
            widget: "list"
            required: false
            summary: "{{fields.label}} ➔ {{fields.url}}"
            fields:
              - { label: "Label", name: "label", widget: "string", required: false, comment: "Text displayed in navigation bar" }
              - { label: "URL Anchor", name: "url", widget: "string", required: false, comment: "Target section ID, e.g. #creators or external URL" }

  - name: "hero_section"
    label: "Section 1: Hero Banner"
    files:
      - file: "_data/hero.yml"
        label: "Hero Content"
        name: "hero_data"
        fields:
          - { label: "Section Anchor ID", name: "section_id", widget: "string", required: false, default: "about", comment: "HTML element ID used for URL jumping (#about)" }
          - { label: "Main Headline", name: "headline", widget: "string", required: false }
          - { label: "Body Paragraph", name: "body", widget: "text", required: false }
          - { label: "Hero Image", name: "image", widget: "image", required: false }
          - label: "Photo Focus Point"
            name: "focal_point"
            widget: "select"
            required: false
            default: "object-center"
            comment: "Align image framing within crop box"
            options:
              - { label: "Center (Default)", value: "object-center" }
              - { label: "Top", value: "object-top" }
              - { label: "Bottom", value: "object-bottom" }
              - { label: "Left", value: "object-left" }
              - { label: "Right", value: "object-right" }
          - label: "Highlights List"
            name: "highlights"
            widget: "list"
            required: false
            summary: "{{fields.icon}} | {{fields.text}}"
            fields:
              - { label: "Material Icon Name", name: "icon", widget: "string", required: false, comment: "Search icon names at https://fonts.google.com/icons (e.g., extension, psychology, diversity_3)" }
              - { label: "Highlight Text", name: "text", widget: "string", required: false }
          - { label: "Download Button Text", name: "button1_text", widget: "string", required: false }
          - { label: "Download Button URL", name: "button1_url", widget: "string", required: false }
          - { label: "Educators Button Text", name: "button2_text", widget: "string", required: false }
          - { label: "Educators Button URL", name: "button2_url", widget: "string", required: false }

  - name: "creators_section"
    label: "Section 2: Creators & Origin"
    files:
      - file: "_data/creators.yml"
        label: "Creators Content"
        name: "creators_data"
        fields:
          - { label: "Section Anchor ID", name: "section_id", widget: "string", required: false, default: "creators", comment: "URL anchor (#creators)" }
          - { label: "Section Title", name: "title", widget: "string", required: false }
          - { label: "Paragraph 1", name: "p1", widget: "text", required: false }
          - { label: "Paragraph 2", name: "p2", widget: "text", required: false }
          - label: "Stat Badges"
            name: "badges"
            widget: "list"
            required: false
            summary: "{{fields.title}} - {{fields.subtitle}}"
            fields:
              - { label: "Badge Title", name: "title", widget: "string", required: false }
              - { label: "Badge Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Workshop Image", name: "image", widget: "image", required: false }
          - label: "Photo Focus Point"
            name: "focal_point"
            widget: "select"
            required: false
            default: "object-center"
            options:
              - { label: "Center (Default)", value: "object-center" }
              - { label: "Top", value: "object-top" }
              - { label: "Bottom", value: "object-bottom" }
              - { label: "Left", value: "object-left" }
              - { label: "Right", value: "object-right" }
          - { label: "Photo Card Title", name: "image_title", widget: "string", required: false }
          - { label: "Photo Card Caption", name: "image_caption", widget: "text", required: false }

  - name: "educators_section"
    label: "Section 3: Educators"
    files:
      - file: "_data/educators.yml"
        label: "Educators Content"
        name: "educators_data"
        fields:
          - { label: "Section Anchor ID", name: "section_id", widget: "string", required: false, default: "educators", comment: "URL anchor (#educators)" }
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Intro Body", name: "body", widget: "text", required: false }
          - { label: "Curriculum Title", name: "curriculum_title", widget: "string", required: false }
          - { label: "Curriculum Body", name: "curriculum_body", widget: "text", required: false }
          - { label: "Discussion Questions Title", name: "discussion_questions_title", widget: "string", required: false }
          - label: "Discussion Questions"
            name: "questions"
            widget: "list"
            required: false
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string", required: false }
          - { label: "Feedback Card Title", name: "feedback_title", widget: "string", required: false }
          - { label: "Feedback Card Body", name: "feedback_body", widget: "text", required: false }
          - { label: "Feedback Button Text", name: "feedback_button_text", widget: "string", required: false }
          - { label: "Educator Image", name: "image", widget: "image", required: false }
          - { label: "Educator Image Caption", name: "image_caption", widget: "string", required: false }

  - name: "download_section"
    label: "Section 4: Download Game"
    files:
      - file: "_data/download.yml"
        label: "Download Content"
        name: "download_data"
        fields:
          - { label: "Section Anchor ID", name: "section_id", widget: "string", required: false, default: "download", comment: "URL anchor (#download)" }
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "text", required: false }
          - { label: "Button Label", name: "button_label", widget: "string", required: false }
          - { label: "Button URL", name: "button_url", widget: "string", required: false }
          - label: "Printing Guidelines & Tips"
            name: "printing_tips"
            widget: "list"
            required: false
            summary: "{{fields.tip}}"
            fields:
              - { label: "Tip", name: "tip", widget: "string", required: false }
          - label: "Materials Needed List"
            name: "materials_needed"
            widget: "list"
            required: false
            summary: "{{fields.icon}} | {{fields.name}}"
            fields:
              - { label: "Material Icon", name: "icon", widget: "string", required: false, comment: "Optional Google Material Symbol icon name (e.g. science, hub, circle, masks). Leave blank for text only." }
              - { label: "Material Name", name: "name", widget: "string", required: false }

  - name: "research_section"
    label: "Section 5: Research"
    files:
      - file: "_data/research.yml"
        label: "Research Publications"
        name: "research_data"
        fields:
          - { label: "Section Anchor ID", name: "section_id", widget: "string", required: false, default: "research", comment: "URL anchor (#research)" }
          - { label: "Section Title", name: "title", widget: "string", required: false }
          - label: "Publication Cards"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - { label: "Category Tag", name: "category", widget: "string", required: false }
              - { label: "Publication Title", name: "title", widget: "string", required: false }
              - { label: "Authors / Citation Details", name: "authors", widget: "text", required: false }
              - { label: "Link Text", name: "link_text", widget: "string", required: false }
              - { label: "Link URL", name: "link_url", widget: "string", required: false }

  - name: "tools_section"
    label: "Section 6: Card Generator"
    files:
      - file: "_data/tools.yml"
        label: "Tool Content"
        name: "tools_data"
        fields:
          - { label: "Section Anchor ID", name: "section_id", widget: "string", required: false, default: "tools", comment: "URL anchor (#tools)" }
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body Paragraph", name: "body", widget: "text", required: false }
          - { label: "Button Label", name: "button_label", widget: "string", required: false }
          - { label: "Tool Target URL", name: "button_url", widget: "string", required: false }

  - name: "collaborators_section"
    label: "Section 7: Collaborators"
    files:
      - file: "_data/collaborators.yml"
        label: "Collaborators Content"
        name: "collaborators_data"
        fields:
          - { label: "Section Anchor ID", name: "section_id", widget: "string", required: false, default: "partners", comment: "URL anchor (#partners)" }
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body Paragraph", name: "body", widget: "text", required: false }
          - label: "Partner Cards"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Icon Name", name: "icon", widget: "string", required: false, comment: "Google Material Symbol icon name (e.g. groups, biotech, school)" }
              - { label: "Partner Name", name: "name", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Feedback Card Title", name: "feedback_title", widget: "string", required: false }
          - { label: "Feedback Card Body", name: "feedback_body", widget: "string", required: false }
          - { label: "Feedback Button Text", name: "feedback_button_text", widget: "string", required: false }

  - name: "supporters_section"
    label: "Section 8: Supporter Logos"
    files:
      - file: "_data/partners.yml"
        label: "Supporter Logos"
        name: "partners_data"
        fields:
          - { label: "Section Anchor ID", name: "section_id", widget: "string", required: false, default: "supporters", comment: "URL anchor (#supporters)" }
          - label: "Supporters & Sponsors"
            name: "partners"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Organization Name", name: "name", widget: "string", required: false }
              - { label: "Logo Image File", name: "logo", widget: "image", required: false }
              - { label: "Website Link", name: "link", widget: "string", required: false }

  - name: "attribution_section"
    label: "Footer Attribution"
    files:
      - file: "_data/attribution.yml"
        label: "Attribution Text"
        name: "attribution_data"
        fields:
          - { label: "Attribution Text", name: "text", widget: "text", required: false, comment: "HTML tags like <strong> are allowed." }
          - label: "FontAwesome Icons"
            name: "icons"
            widget: "list"
            required: false
            summary: "{{fields.icon}}"
            fields:
              - { label: "Icon Class", name: "icon", widget: "string", required: false, comment: "e.g. fa-creative-commons, fa-creative-commons-by" }

  - name: "settings_section"
    label: "Site Contact Info"
    files:
      - file: "_data/settings.yml"
        label: "Contact & Location"
        name: "contact_data"
        fields:
          - { label: "Project Title", name: "title", widget: "string", required: false }
          - { label: "Contact Email", name: "email", widget: "string", required: false, comment: "Global contact email used across header and buttons" }
          - { label: "Department", name: "department", widget: "string", required: false }
          - { label: "Institution", name: "institution", widget: "string", required: false }
          - { label: "Location", name: "location", widget: "string", required: false }
