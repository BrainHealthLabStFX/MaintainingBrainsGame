<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.data.configuration.site_title | default: site.title }}{% if site.data.configuration.site_subtitle %} | {{ site.data.configuration.site_subtitle }}{% elsif site.lab.institution %} | {{ site.lab.institution }}{% endif %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            pink: '{{ site.brand_colors.primary }}',
                            darkPink: '{{ site.brand_colors.dark_pink }}',
                            lightPink: '{{ site.brand_colors.light_pink }}',
                            titleGray: '{{ site.brand_colors.title_gray }}',
                            stfxNavy: '{{ site.brand_colors.stfx_navy }}',
                            bgLight: '#FDF7FA',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-nav {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
        }
        .hero-gradient {
            background: linear-gradient(135deg, #002A5C 0%, #4A154B 50%, #D25299 100%);
        }
        .photo-card {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }
        .photo-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(210, 82, 153, 0.25);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand-pink selection:text-white">

    <!-- Navigation Header -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-nav border-b border-pink-100 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-2xl bg-brand-pink text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-pink-200 group-hover:bg-brand-darkPink transition-all duration-300 group-hover:scale-105">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <span class="font-extrabold text-xl text-slate-900 tracking-tight block leading-none group-hover:text-brand-pink transition-colors">{{ site.title }}</span>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-8 text-sm font-bold text-slate-600">
                <a href="#about" class="hover:text-brand-pink transition-colors">Home</a>
                <a href="#game-details" class="hover:text-brand-pink transition-colors">How To Play</a>
                <a href="#gallery" class="hover:text-brand-pink transition-colors">Photos</a>
                <a href="#partners" class="hover:text-brand-pink transition-colors">Partners</a>
            </nav>

            <div class="flex items-center gap-4">
                <a href="mailto:{{ site.lab.email }}" class="bg-brand-pink hover:bg-brand-darkPink text-white font-bold text-sm px-6 py-2.5 rounded-full shadow-lg shadow-pink-300/50 transition-all flex items-center gap-2 hover:scale-105">
                    <span class="material-symbols-outlined text-lg">mail</span>
                    <span>Contact Us</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Injection -->
    <main>
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-white py-14 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-8">
            <div class="flex items-center gap-4 text-center md:text-left">
                <div class="w-12 h-12 rounded-2xl bg-brand-pink text-white flex items-center justify-center font-bold text-2xl shadow-lg shadow-pink-900/50">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <div class="font-extrabold text-lg text-white">{{ site.title }}</div>
                    <div class="text-xs text-slate-400">{{ site.lab.department }} • {{ site.lab.institution }}</div>
                    <div class="text-xs text-slate-400">{{ site.lab.location }}</div>
                </div>
            </div>

            <div class="text-center md:text-right">
                <a href="mailto:{{ site.lab.email }}" class="text-brand-lightPink hover:text-white font-bold text-sm transition-colors flex items-center justify-center md:justify-end gap-2 mb-2">
                    <i class="fa-solid fa-envelope"></i> {{ site.lab.email }}
                </a>
                <div class="text-xs text-slate-500">
                    &copy; {{ 'now' | date: "%Y" }} {{ site.lab.name }} at StFX. All rights reserved.
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
